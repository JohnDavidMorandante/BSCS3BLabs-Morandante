<!DOCTYPE html>
<html>
<head>
  <title>Text Submission Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .container {
      max-width: 400px;
    }
    input[type="text"] {
      width: 50%;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
      margin-left: 4px;
    }
    #output, #gradeOutput {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
    #bulb, #gradeImg {
      display: block;
      margin-top: 20px;
      width: 80px;
    }
  </style>
</head>
<body>

  <div class="container">
    <p>Enter your name</p>
    <input type="text" id="userInput">
    <button onclick="showText()">Submit</button>
    <button onclick="newBulb()">New</button>

    <img id="bulb" src="off.png" alt="lightbulb">

    <div id="output"></div>

    <p>Enter grade</p>
    <input type="text" id="gradeInput">
    <button onclick="checkGrade()">Submit</button>
    <button onclick="newGrade()">New</button>

    <div id="gradeOutput"></div>

    <img id="gradeImg" src="off.png" alt="grade">
  </div>

  <script>
    function showText() {
      var text = document.getElementById("userInput").value;
      document.getElementById("output").innerHTML = "User's name is " + text;
      document.getElementById("userInput").value = "";
      document.getElementById("bulb").src = "on.png";
    }

    function newBulb() {
      document.getElementById("bulb").src = "off.png";
      document.getElementById("output").innerHTML = "";
      document.getElementById("userInput").value = "";
    }

    function checkGrade() {
      var grade = document.getElementById("gradeInput").value;
      grade = Number(grade);

      if (grade < 60) {
        document.getElementById("gradeOutput").innerHTML = "Underflow";
        document.getElementById("gradeImg").src = "off.png";
      } else if (grade > 100) {
        document.getElementById("gradeOutput").innerHTML = "Overflow";
        document.getElementById("gradeImg").src = "off.png";
      } else if (grade < 75) {
        document.getElementById("gradeOutput").innerHTML = "Failed";
        document.getElementById("gradeImg").src = "off.png";
      } else {
        document.getElementById("gradeOutput").innerHTML = "Passed";
        document.getElementById("gradeImg").src = "on.png";
      }
    }

    function newGrade() {
      document.getElementById("gradeInput").value = "";
      document.getElementById("gradeOutput").innerHTML = "";
      document.getElementById("gradeImg").src = "off.png";
    }
  </script>

</body>
</html>
