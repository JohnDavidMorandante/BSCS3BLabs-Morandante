<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Highlighted Student Data Table</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #cccccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    .bg-yellow {
      background-color: #fff176; /* Yellow */
      color: #000000;
    }
    .bg-blue {
      background-color: #64b5f6; /* Blue */
      color: #ffffff;
    }
    .bg-purple {
      background-color: #ba68c8; /* Purple */
      color: #ffffff;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Grade Level</th>
        <th>Course</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Alex Johnson</td>
        <td class="bg-yellow">1st Year</td>
        <td>Computer Science</td>
      </tr>
      <tr>
        <td>Maria Garcia</td>
        <td>2nd Year</td>
        <td>Information Technology</td>
      </tr>
      <tr>
        <td class="bg-blue">Liam Smith</td>
        <td>3rd Year</td>
        <td>Software Engineering</td>
      </tr>
      <tr>
        <td>Emma Davis</td>
        <td>4th Year</td>
        <td class="bg-purple">Data Science</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
