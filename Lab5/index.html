<!DOCTYPE html>
<html>
<head>
  <title>Text Submission Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .container {
      max-width: 400px;
    }
    input[type="text"] {
      width: 50%;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
      margin-left: 4px;
    }
    #output {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
    #bulb {
      display: block;
      margin-top: 20px;
      width: 80px;
    }
  </style>
</head>
<body>

  <div class="container">
    <p>Enter your name</p>
    <input type="text" id="userInput">
    <button onclick="showText()">Submit</button>
    <button onclick="newBulb()">New</button>

    <img id="bulb" src="off.png" alt="lightbulb">

    <div id="output"></div>
  </div>

  <script>
    function showText() {
      var text = document.getElementById("userInput").value;
      document.getElementById("output").innerHTML = "User's name is " + text;
      document.getElementById("userInput").value = "";
      document.getElementById("bulb").src = "on.png";
    }

    function newBulb() {
      document.getElementById("bulb").src = "off.png";
      document.getElementById("output").innerHTML = "";
      document.getElementById("userInput").value = "";
    }
  </script>

</body>
</html>
